# Publishes the site to Cloudflare Workers (static assets) on every push to main.
# Needs the repository secret CLOUDFLARE_API_TOKEN. Without it this does nothing.

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check for the Cloudflare token
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set yet, so nothing was deployed."; echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22


      - name: Deploy to Cloudflare
        if: steps.creds.outputs.ok == 'true'
        shell: bash
        run: npx --yes wrangler@4 deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"

      - name: Check the published site
        if: steps.creds.outputs.ok == 'true'
        run: |
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          for u in "$url" https://wagerassistant.com; do
            [ -n "$u" ] || continue
            code=$(curl -s -o "$RUNNER_TEMP/p.html" -w '%{http_code}' --max-time 20 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130.0 Safari/537.36' "$u/")
            echo "$u/ -> HTTP $code, injected bot-check script: $(grep -c 'challenge-platform/scripts/jsd' "$RUNNER_TEMP/p.html")"
          done
